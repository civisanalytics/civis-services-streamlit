name: Build and test image
description: Build the test target and check that the demo app runs inside it.

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build the test image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: test
        load: true
        push: false
        tags: civis-services-streamlit:test

    - name: Check that the demo app can run inside the image
      shell: bash
      run: docker run --rm civis-services-streamlit:test /app/demo_app/test_demo_app_on_ci.sh
